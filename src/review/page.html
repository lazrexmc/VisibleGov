<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisibleGov — Review</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f7f7f5; color: #1a1a1a; }
  header { padding: 0.75rem 1rem; background: #1a1a1a; color: #fff; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header select { font-size: 0.9rem; padding: 0.25rem; min-width: 20rem; }
  #status-msg { font-size: 0.85rem; color: #ffd76a; }
  .tabs { display: flex; gap: 0.25rem; }
  .tab-btn { padding: 0.35rem 0.8rem; font-size: 0.9rem; cursor: pointer; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #ccc; }
  .tab-btn.active { background: #fff; color: #1a1a1a; border-color: #fff; font-weight: 600; }
  main.panes { display: flex; gap: 1px; background: #ccc; height: calc(100vh - 3rem); }
  .pane { background: #fff; padding: 1rem; overflow-y: auto; flex: 1 1 50%; }
  .pane h2 { margin-top: 0; font-size: 1.05rem; }
  pre#bill-text { white-space: pre-wrap; word-wrap: break-word; font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; line-height: 1.4; }
  .vote-strip { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 6px; padding: 0.5rem 0.75rem; margin-bottom: 0.75rem; font-size: 0.9rem; }
  #draft-rendered { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.75rem; background: #fafafa; }
  #draft-rendered ul { margin: 0.25rem 0; padding-left: 1.25rem; }
  #draft-rendered p { margin: 0.5rem 0; }
  .verify-strip { border-radius: 6px; padding: 0.5rem 0.75rem; margin-bottom: 0.75rem; font-size: 0.9rem; }
  .verify-strip.verify-clean { background: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; }
  .verify-strip.verify-flagged { background: #fff8e1; border: 1px solid #ffe082; color: #8d6e00; }
  .verify-strip.verify-unverified { background: #f0f0f0; border: 1px solid #ccc; color: #666; }
  .verify-label { font-weight: 600; }
  .verify-flags { margin: 0.4rem 0 0; padding-left: 1.1rem; }
  .verify-flags li { margin-bottom: 0.5rem; }
  .verify-quote { font-style: italic; opacity: 0.85; margin-top: 0.15rem; }
  label { display: block; font-size: 0.8rem; font-weight: 600; margin: 0.5rem 0 0.25rem; }
  textarea { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; padding: 0.5rem; }
  .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
  .actions button { padding: 0.4rem 0.9rem; font-size: 0.9rem; cursor: pointer; border-radius: 4px; border: 1px solid #999; background: #fff; }
  #btn-approve, #g-btn-approve { border-color: #2e7d32; color: #2e7d32; }
  #btn-reject, #g-btn-reject { border-color: #c62828; color: #c62828; }
  #btn-publish, #g-btn-publish { border-color: #1565c0; color: #1565c0; font-weight: 600; }
  .background-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: #555; margin-bottom: 0.35rem; }
  #glossary-citation { font-size: 0.9rem; margin-bottom: 0.5rem; }
  #glossary-source-link { font-size: 0.85rem; margin-bottom: 1rem; word-break: break-all; }
  #glossary-gloss-rendered { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; background: #fafafa; white-space: pre-wrap; }
  .quote-label { font-size: 0.8rem; font-weight: 600; margin-top: 0.25rem; }
  main.panes { min-height: calc(100vh - 3rem); height: auto; }
  .glossary-toolbar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; padding: 0.5rem 1rem; background: #efefe9; border-bottom: 1px solid #ddd; font-size: 0.85rem; }
  .glossary-toolbar button { padding: 0.3rem 0.7rem; font-size: 0.82rem; cursor: pointer; border-radius: 4px; border: 1px solid #999; background: #fff; }
  #glossary-counts { font-weight: 600; }
  .sample-results { padding: 0.75rem 1rem; background: #fffef5; border-bottom: 1px solid #ddd; }
  .sample-results h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
  .sample-card { border: 1px solid #ddd; border-radius: 6px; padding: 0.6rem 0.8rem; margin-bottom: 0.6rem; background: #fff; }
  .sample-term { font-weight: 600; margin-bottom: 0.3rem; }
  .sample-gloss { margin-bottom: 0.3rem; }
  .sample-link { font-size: 0.8rem; word-break: break-all; }
</style>
</head>
<body>

<header>
  <h1>VisibleGov — Review</h1>
  <nav class="tabs">
    <button id="tab-summaries" type="button" class="tab-btn active">Summaries</button>
    <button id="tab-glossary" type="button" class="tab-btn">Glossary</button>
  </nav>
  <select id="queue"><option>Loading…</option></select>
  <select id="glossary-queue" style="display:none"><option>Loading…</option></select>
  <span id="status-msg"></span>
</header>

<div id="glossary-toolbar" class="glossary-toolbar" style="display:none">
  <span id="glossary-counts"></span>
  <button id="glossary-toggle-stubs" type="button">Show pending stubs</button>
  <button id="glossary-toggle-published" type="button">Show published</button>
  <button id="glossary-sample-btn" type="button">Sample 5 published for audit</button>
</div>
<div id="glossary-sample-results" class="sample-results" style="display:none"></div>

<main class="panes" id="summary-panes">
  <section class="pane pane-text">
    <h2 id="bill-heading">Select an item from the queue</h2>
    <pre id="bill-text"></pre>
  </section>
  <section class="pane pane-draft">
    <div id="vote-strip" class="vote-strip">No vote on file.</div>
    <div id="verification-strip" class="verify-strip verify-unverified"></div>
    <div id="draft-rendered"></div>
    <label for="draft-edit">Edit draft (Markdown)</label>
    <textarea id="draft-edit" rows="12"></textarea>
    <label for="note">Note (required for Reject)</label>
    <textarea id="note" rows="3"></textarea>
    <div class="actions">
      <button id="btn-save-edit" type="button">Save Edit</button>
      <button id="btn-approve" type="button">Approve</button>
      <button id="btn-reject" type="button">Reject</button>
      <button id="btn-publish" type="button">Publish</button>
    </div>
  </section>
</main>

<main class="panes" id="glossary-panes" style="display:none">
  <section class="pane pane-text">
    <h2 id="glossary-heading">Select a term from the queue</h2>
    <div id="glossary-background-label" class="background-label">Background — from the referenced law's official text</div>
    <div id="glossary-citation"></div>
    <div id="glossary-source-link"></div>
  </section>
  <section class="pane pane-draft">
    <div id="glossary-verification-strip" class="verify-strip verify-unverified"></div>
    <div id="glossary-gloss-rendered"></div>
    <div id="glossary-quote-block"></div>
    <label for="glossary-edit">Edit gloss (plain language, 1-2 sentences)</label>
    <textarea id="glossary-edit" rows="6"></textarea>
    <label for="glossary-note">Note (required for Reject)</label>
    <textarea id="glossary-note" rows="3"></textarea>
    <div class="actions">
      <button id="g-btn-save-edit" type="button">Save Edit</button>
      <button id="g-btn-approve" type="button">Approve</button>
      <button id="g-btn-reject" type="button">Reject</button>
      <button id="g-btn-publish" type="button">Publish</button>
    </div>
  </section>
</main>

<script>
  let currentId = null;

  // Minimal markdown renderer: bold + bullets + paragraphs only (the body_md we generate uses
  // nothing else). Escapes HTML first so bold markers can't be used to inject tags.
  function renderMarkdown(md) {
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const bold = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const lines = (md || '').split('\n');
    const html = [];
    let list = [];
    const flushList = () => { if (list.length) { html.push('<ul>' + list.join('') + '</ul>'); list = []; } };
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) { flushList(); continue; }
      const m = line.match(/^[-*]\s+(.*)$/);
      if (m) { list.push('<li>' + bold(m[1]) + '</li>'); continue; }
      flushList();
      html.push('<p>' + bold(line) + '</p>');
    }
    flushList();
    return html.join('\n');
  }

  function setStatus(msg) {
    document.getElementById('status-msg').textContent = msg;
  }

  // Mirrors src/review/server.js's TRANSITIONS table (action names only — the server is still
  // the enforcement authority; an illegal action still 400s there regardless of what the UI
  // shows). approved has no 'edit'/'approve' action, only publish/reject — without this, the
  // buttons for those illegal actions stayed visible on an approved item with no way to tell
  // that clicking them would fail.
  var STATUS_ACTIONS = {
    draft: ['edit', 'approve', 'reject'],
    stale: ['edit', 'approve', 'reject'],
    approved: ['publish', 'reject'],
  };

  function updateActionButtons(status) {
    var actions = STATUS_ACTIONS[status] || [];
    var buttonsByAction = {
      edit: document.getElementById('btn-save-edit'),
      approve: document.getElementById('btn-approve'),
      reject: document.getElementById('btn-reject'),
      publish: document.getElementById('btn-publish'),
    };
    for (var action in buttonsByAction) {
      buttonsByAction[action].style.display = actions.indexOf(action) !== -1 ? '' : 'none';
    }
  }

  // Mirrors src/review/server.js's verificationBadge() — null/no verification yet vs. clean vs.
  // flagged, with a human-readable count in the label.
  function verificationBadge(verification) {
    if (!verification) return { state: 'unverified', label: 'Unverified' };
    var verdicts = verification.verdicts || [];
    if (verification.overall === 'clean') {
      return { state: 'clean', label: 'Verifier found all ' + verdicts.length + ' bullets supported' };
    }
    var unsupported = verdicts.filter(function (v) { return !v.supported; }).length;
    return { state: 'flagged', label: 'Verifier flagged ' + unsupported + ' of ' + verdicts.length + ' bullets' };
  }

  // Verifier-provided strings (reason, evidence_quote, section) are model output and MUST be
  // rendered via textContent, never innerHTML — built entirely with DOM APIs for that reason.
  function renderVerification(verification) {
    var strip = document.getElementById('verification-strip');
    strip.textContent = '';
    strip.className = 'verify-strip';
    var badge = verificationBadge(verification);
    strip.classList.add('verify-' + badge.state);

    var label = document.createElement('div');
    label.className = 'verify-label';
    label.textContent = badge.label;
    strip.appendChild(label);

    if (badge.state === 'flagged') {
      var list = document.createElement('ul');
      list.className = 'verify-flags';
      var verdicts = verification.verdicts || [];
      for (var i = 0; i < verdicts.length; i++) {
        var v = verdicts[i];
        if (v.supported) continue;
        var li = document.createElement('li');
        var head = document.createElement('div');
        head.textContent = 'Bullet ' + (v.bullet_index + 1) + ' (' + v.section + '): ' + v.reason;
        var quote = document.createElement('div');
        quote.className = 'verify-quote';
        quote.textContent = 'Evidence: "' + v.evidence_quote + '"';
        li.appendChild(head);
        li.appendChild(quote);
        list.appendChild(li);
      }
      strip.appendChild(list);
    }
  }

  async function loadQueue() {
    const select = document.getElementById('queue');
    let items = [];
    try {
      const res = await fetch('/api/queue');
      if (!res.ok) throw new Error('queue fetch failed');
      items = await res.json();
    } catch {
      select.textContent = '';
      select.appendChild(new Option('Error loading queue', ''));
      return;
    }
    select.textContent = '';
    if (items.length === 0) {
      select.appendChild(new Option('Queue is empty', ''));
      return;
    }
    for (const it of items) {
      const label = '[' + it.status + '] ' + (it.bill ? it.bill.identifier : '?') + ' — ' + (it.bill && it.bill.title ? it.bill.title : '');
      select.appendChild(new Option(label, it.id));
    }
    if (!currentId || !items.some((it) => it.id === currentId)) currentId = items[0].id;
    select.value = currentId;
    await loadItem(currentId);
  }

  async function loadItem(id) {
    try {
      const res = await fetch('/api/item/' + encodeURIComponent(id));
      if (!res.ok) throw new Error('item fetch failed');
      const data = await res.json();

      document.getElementById('bill-heading').textContent = data.bill
        ? data.bill.identifier + ' — ' + (data.bill.title || '')
        : 'Unknown bill';
      document.getElementById('bill-text').textContent = data.text || '(no bill text on file)';
      document.getElementById('draft-rendered').innerHTML = renderMarkdown(data.summary.body_md || '');
      document.getElementById('draft-edit').value = data.summary.body_md || '';
      document.getElementById('note').value = '';
      renderVerification(data.verification || null);
      updateActionButtons(data.summary.status);

      const vs = document.getElementById('vote-strip');
      vs.textContent = data.vote
        ? (data.vote.question || 'Vote') + ' — ' + (data.vote.result || '?') + ' — Yea ' + data.vote.yeas + ', Nay ' + data.vote.nays
        : 'No vote on file.';
    } catch {
      setStatus('Error loading item.');
    }
  }

  async function postDecision(action) {
    if (!currentId) return;
    const payload = { summary_id: currentId, action, note: document.getElementById('note').value };
    if (action === 'edit') payload.body_md = document.getElementById('draft-edit').value;
    try {
      const res = await fetch('/api/decision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) { setStatus('Error: ' + (body.error || res.status)); return; }
      setStatus('Saved: ' + body.status);
      await loadQueue();
    } catch {
      setStatus('Network error.');
    }
  }

  document.getElementById('queue').addEventListener('change', (e) => {
    currentId = e.target.value;
    if (currentId) loadItem(currentId);
  });
  document.getElementById('btn-save-edit').addEventListener('click', () => postDecision('edit'));
  document.getElementById('btn-approve').addEventListener('click', () => postDecision('approve'));
  document.getElementById('btn-reject').addEventListener('click', () => postDecision('reject'));
  document.getElementById('btn-publish').addEventListener('click', () => postDecision('publish'));

  // ==========================================================================================
  // Task 6: glossary review queue tab. Mirrors the summary-review JS above in every pattern
  // (queue/item/decision fetch shape, verification-strip rendering, status-gated action buttons)
  // — controller ruling #2, "same TRANSITIONS-table pattern" applies to the client mirror too.
  // ==========================================================================================

  let currentGlossaryId = null;

  // Trust model v3 mechanism 2 (src/cli/auto-publish-glossary.js): clean, verified glossary
  // drafts now auto-publish with zero human touch, so this tab's job shifted from "review every
  // actionable item" to "surface what the pipeline could NOT auto-handle." glossaryQueueItems
  // holds the full, unfiltered /api/glossary/queue response in memory so the toggles below and
  // the sample-for-audit button can slice it client-side without extra round trips.
  let glossaryQueueItems = [];
  let showGlossaryStubs = false;
  let showGlossaryPublished = false;

  // Flagged is THE queue now (needs Lance's own read) and approved-pending-publish needs his
  // publish click — both shown expanded by default. Stubs (no gloss yet, includes needs_mapping)
  // and published rows are reachable but collapsed behind their own toggle, same "reachable, not
  // in-your-face" pattern the original stub-collapse design used. In steady state a has_gloss row
  // is always either clean or flagged (gloss.js writes the verification in the same operation as
  // the gloss itself — see persistGloss) — clean ones don't linger here; the CLI already moved
  // them on. Nothing from the 401-row total silently vanishes: every row lands in exactly one of
  // these four buckets.
  function computeGlossaryGroups(items) {
    const flagged = items.filter((it) => it.has_gloss && it.verified === 'flagged');
    const approved = items.filter((it) => it.status === 'approved');
    const stubs = items.filter((it) => !it.has_gloss);
    const published = items.filter((it) => it.status === 'published');
    return { flagged, approved, stubs, published };
  }

  function glossaryOptionLabel(it) {
    const mapping = it.needs_mapping ? ' [needs mapping]' : '';
    const glossState = it.has_gloss ? '' : ' (not yet glossed)';
    return '[' + it.status + '] ' + it.term + mapping + glossState;
  }

  function appendGlossaryOptgroup(select, label, groupItems) {
    if (groupItems.length === 0) return;
    const og = document.createElement('optgroup');
    og.label = label + ' (' + groupItems.length + ')';
    for (const it of groupItems) og.appendChild(new Option(glossaryOptionLabel(it), it.id));
    select.appendChild(og);
  }

  function renderGlossaryToolbar(groups) {
    document.getElementById('glossary-counts').textContent =
      groups.flagged.length + ' flagged · ' + groups.approved.length + ' approved (pending publish) · '
      + groups.published.length + ' published · ' + groups.stubs.length + ' pending stubs';

    const stubBtn = document.getElementById('glossary-toggle-stubs');
    stubBtn.textContent = (showGlossaryStubs ? 'Hide' : 'Show') + ' ' + groups.stubs.length + ' pending stubs';
    stubBtn.style.display = groups.stubs.length > 0 ? '' : 'none';

    const pubBtn = document.getElementById('glossary-toggle-published');
    pubBtn.textContent = (showGlossaryPublished ? 'Hide' : 'Show') + ' ' + groups.published.length + ' published';
    pubBtn.style.display = groups.published.length > 0 ? '' : 'none';

    document.getElementById('glossary-sample-btn').style.display = groups.published.length > 0 ? '' : 'none';
  }

  // Rebuilds the <select> from the in-memory item list — called on load and by the toggle
  // buttons, never re-fetches. Returns the flat list of currently-selectable items (needed so the
  // caller can decide whether currentGlossaryId is still reachable).
  function renderGlossarySelect() {
    const select = document.getElementById('glossary-queue');
    const groups = computeGlossaryGroups(glossaryQueueItems);
    renderGlossaryToolbar(groups);
    select.textContent = '';

    if (glossaryQueueItems.length === 0) {
      select.appendChild(new Option('Glossary queue is empty', ''));
      return [];
    }

    appendGlossaryOptgroup(select, 'Flagged — needs review', groups.flagged);
    appendGlossaryOptgroup(select, 'Approved — pending publish', groups.approved);
    if (showGlossaryStubs) appendGlossaryOptgroup(select, 'Pending stubs', groups.stubs);
    if (showGlossaryPublished) appendGlossaryOptgroup(select, 'Published', groups.published);

    const visible = groups.flagged.concat(
      groups.approved,
      showGlossaryStubs ? groups.stubs : [],
      showGlossaryPublished ? groups.published : [],
    );
    if (visible.length === 0) select.appendChild(new Option('Nothing needs your review right now', ''));
    return visible;
  }

  // Re-renders the select after a toggle flips, keeping the current selection if it's still
  // reachable, otherwise falling back to the first now-visible item (same "always land on
  // something selectable" behavior loadGlossaryQueue already had).
  function refreshGlossarySelectAfterToggle() {
    const select = document.getElementById('glossary-queue');
    const visible = renderGlossarySelect();
    if (visible.length === 0) return;
    if (!currentGlossaryId || !visible.some((it) => it.id === currentGlossaryId)) {
      currentGlossaryId = visible[0].id;
    }
    select.value = currentGlossaryId;
    loadGlossaryItem(currentGlossaryId);
  }

  document.getElementById('glossary-toggle-stubs').addEventListener('click', () => {
    showGlossaryStubs = !showGlossaryStubs;
    refreshGlossarySelectAfterToggle();
  });
  document.getElementById('glossary-toggle-published').addEventListener('click', () => {
    showGlossaryPublished = !showGlossaryPublished;
    refreshGlossarySelectAfterToggle();
  });

  // Sample 5 for audit (Lance's spot-audit role, trust model v3): now samples from PUBLISHED
  // items — clean drafts no longer sit in the review queue waiting for a look, they're already
  // live, so this is the "check the machine's work after the fact" tool. Client-side random pick
  // from the in-memory item list (no server change — /api/glossary/item/:id already returns
  // gloss_md/supported_by_quote/source_url for any status, published included), rendered expanded
  // for eyeball comparison. All model/user text via textContent only (escaping discipline
  // unchanged).
  document.getElementById('glossary-sample-btn').addEventListener('click', () => sampleGlossaryPublished());

  async function sampleGlossaryPublished() {
    const published = glossaryQueueItems.filter((it) => it.status === 'published');
    if (published.length === 0) { setStatus('No published items to sample yet.'); return; }

    const pool = published.slice();
    const picks = [];
    const n = Math.min(5, pool.length);
    for (let i = 0; i < n; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      picks.push(pool.splice(idx, 1)[0]);
    }

    const container = document.getElementById('glossary-sample-results');
    container.textContent = '';
    container.style.display = '';

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.textContent = 'Close sample';
    closeBtn.addEventListener('click', () => { container.style.display = 'none'; container.textContent = ''; });
    container.appendChild(closeBtn);

    const heading = document.createElement('h3');
    heading.textContent = 'Sample of ' + picks.length + ' published item(s) for audit';
    container.appendChild(heading);

    for (const it of picks) {
      let data;
      try {
        const res = await fetch('/api/glossary/item/' + encodeURIComponent(it.id));
        if (!res.ok) continue;
        data = await res.json();
      } catch {
        continue;
      }
      if (!data.available) continue;
      const term = data.term;

      const card = document.createElement('div');
      card.className = 'sample-card';

      const t = document.createElement('div');
      t.className = 'sample-term';
      t.textContent = term.term + ' (' + term.kind + ')';
      card.appendChild(t);

      const gloss = document.createElement('div');
      gloss.className = 'sample-gloss';
      gloss.textContent = term.gloss_md || '';
      card.appendChild(gloss);

      if (term.supported_by_quote) {
        const qLabel = document.createElement('div');
        qLabel.className = 'quote-label';
        qLabel.textContent = "Author model's claimed supporting quote:";
        card.appendChild(qLabel);
        const quote = document.createElement('div');
        quote.className = 'verify-quote';
        quote.textContent = term.supported_by_quote;
        card.appendChild(quote);
      }

      if (term.source_url) {
        const link = document.createElement('div');
        link.className = 'sample-link';
        const a = document.createElement('a');
        a.href = term.source_url;
        a.textContent = term.source_url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        link.appendChild(a);
        card.appendChild(link);
      }

      container.appendChild(card);
    }
  }

  // Mirrors src/review/server.js's TRANSITIONS table, same as STATUS_ACTIONS above.
  var GLOSSARY_STATUS_ACTIONS = {
    draft: ['edit', 'approve', 'reject'],
    stale: ['edit', 'approve', 'reject'],
    approved: ['publish', 'reject'],
  };

  // Controller ruling #2: "the queue SHOULD only offer publish on glossed+verified terms" — the
  // server's DB CHECK (glossary_terms_published_complete) is the real enforcement; this is only a
  // client-side courtesy that hides the button when there is plainly nothing to publish yet
  // (no gloss_md). The server still surfaces the CHECK violation honestly if this filter is ever
  // wrong (e.g. an approved row that somehow lost its gloss) — see isPublishCompletenessViolation.
  function updateGlossaryActionButtons(status, hasGloss) {
    var actions = (GLOSSARY_STATUS_ACTIONS[status] || []).slice();
    if (!hasGloss) actions = actions.filter(function (a) { return a !== 'publish'; });
    var buttonsByAction = {
      edit: document.getElementById('g-btn-save-edit'),
      approve: document.getElementById('g-btn-approve'),
      reject: document.getElementById('g-btn-reject'),
      publish: document.getElementById('g-btn-publish'),
    };
    for (var action in buttonsByAction) {
      buttonsByAction[action].style.display = actions.indexOf(action) !== -1 ? '' : 'none';
    }
  }

  // Mirrors src/review/server.js's glossVerificationBadge() — same mechanical derivation as
  // verificationBadge() above, "sentences" wording since glosser.js's verdicts index gloss
  // sentences, not summary bullets (controller ruling #3).
  function glossVerificationBadge(verification) {
    if (!verification) return { state: 'unverified', label: 'Unverified' };
    var verdicts = verification.verdicts || [];
    if (verification.overall === 'clean') {
      return { state: 'clean', label: 'Verifier found all ' + verdicts.length + ' sentences supported' };
    }
    var unsupported = verdicts.filter(function (v) { return !v.supported; }).length;
    return { state: 'flagged', label: 'Verifier flagged ' + unsupported + ' of ' + verdicts.length + ' sentences' };
  }

  // Verifier-provided strings (reason, evidence_quote) are model output and MUST be rendered via
  // textContent, never innerHTML (controller ruling #5) — same discipline as renderVerification().
  function renderGlossaryVerification(verification) {
    var strip = document.getElementById('glossary-verification-strip');
    strip.textContent = '';
    strip.className = 'verify-strip';
    var badge = glossVerificationBadge(verification);
    strip.classList.add('verify-' + badge.state);

    var label = document.createElement('div');
    label.className = 'verify-label';
    label.textContent = badge.label;
    strip.appendChild(label);

    if (badge.state === 'flagged') {
      var list = document.createElement('ul');
      list.className = 'verify-flags';
      var verdicts = verification.verdicts || [];
      for (var i = 0; i < verdicts.length; i++) {
        var v = verdicts[i];
        if (v.supported) continue;
        var li = document.createElement('li');
        var head = document.createElement('div');
        head.textContent = 'Sentence ' + (v.bullet_index + 1) + ': ' + v.reason;
        var quote = document.createElement('div');
        quote.className = 'verify-quote';
        quote.textContent = 'Evidence: "' + v.evidence_quote + '"';
        li.appendChild(head);
        li.appendChild(quote);
        list.appendChild(li);
      }
      strip.appendChild(list);
    }
  }

  // Honest degradation (controller ruling #6): /api/glossary/queue and /api/glossary/item both
  // return {available:false, reason} — never a 500 — when migration 0007 hasn't been applied.
  // Render that state plainly rather than an empty/blank pane so it reads as "not yet available",
  // not "broken".
  function showGlossaryUnavailable(reason) {
    document.getElementById('glossary-heading').textContent = 'Glossary unavailable';
    document.getElementById('glossary-citation').textContent = reason || 'migration 0007 not applied';
    document.getElementById('glossary-source-link').textContent = '';
    document.getElementById('glossary-gloss-rendered').textContent = '';
    document.getElementById('glossary-quote-block').textContent = '';
    document.getElementById('glossary-edit').value = '';
    renderGlossaryVerification(null);
    updateGlossaryActionButtons('', false);
    document.getElementById('glossary-counts').textContent = '';
    document.getElementById('glossary-toggle-stubs').style.display = 'none';
    document.getElementById('glossary-toggle-published').style.display = 'none';
    document.getElementById('glossary-sample-btn').style.display = 'none';
  }

  async function loadGlossaryQueue() {
    const select = document.getElementById('glossary-queue');
    let body;
    try {
      const res = await fetch('/api/glossary/queue');
      if (!res.ok) throw new Error('glossary queue fetch failed');
      body = await res.json();
    } catch {
      select.textContent = '';
      select.appendChild(new Option('Error loading glossary queue', ''));
      glossaryQueueItems = [];
      return;
    }
    select.textContent = '';
    if (!body.available) {
      select.appendChild(new Option('Glossary unavailable: ' + (body.reason || 'migration 0007 not applied'), ''));
      showGlossaryUnavailable(body.reason);
      glossaryQueueItems = [];
      return;
    }
    glossaryQueueItems = body.items || [];
    const visible = renderGlossarySelect();
    if (visible.length === 0) return;
    if (!currentGlossaryId || !visible.some((it) => it.id === currentGlossaryId)) currentGlossaryId = visible[0].id;
    select.value = currentGlossaryId;
    await loadGlossaryItem(currentGlossaryId);
  }

  async function loadGlossaryItem(id) {
    try {
      const res = await fetch('/api/glossary/item/' + encodeURIComponent(id));
      if (!res.ok) throw new Error('glossary item fetch failed');
      const data = await res.json();
      if (!data.available) {
        showGlossaryUnavailable(data.reason);
        return;
      }
      const term = data.term;

      // term/kind/citation-or-needs_mapping-badge/gloss_md/supported_by_quote/source_url are ALL
      // model-authored or user-provided content — textContent only (controller ruling #5).
      document.getElementById('glossary-heading').textContent = term.term + ' (' + term.kind + ')';
      document.getElementById('glossary-citation').textContent = term.citation
        ? 'Citation: ' + term.citation
        : (term.needs_mapping ? '[needs mapping] — no resolved citation yet' : 'No citation on file');

      const linkContainer = document.getElementById('glossary-source-link');
      linkContainer.textContent = '';
      if (term.source_url) {
        const a = document.createElement('a');
        a.href = term.source_url;
        a.textContent = term.source_url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        linkContainer.appendChild(a);
      } else {
        linkContainer.textContent = 'No source on file yet.';
      }

      document.getElementById('glossary-gloss-rendered').textContent = term.gloss_md || '(not yet glossed)';
      document.getElementById('glossary-edit').value = term.gloss_md || '';
      document.getElementById('glossary-note').value = '';

      const quoteBlock = document.getElementById('glossary-quote-block');
      quoteBlock.textContent = '';
      if (term.supported_by_quote) {
        const qLabel = document.createElement('div');
        qLabel.className = 'quote-label';
        qLabel.textContent = "Author model's claimed supporting quote:";
        const quote = document.createElement('div');
        quote.className = 'verify-quote';
        quote.textContent = term.supported_by_quote;
        quoteBlock.appendChild(qLabel);
        quoteBlock.appendChild(quote);
      }

      renderGlossaryVerification(data.verification || null);
      updateGlossaryActionButtons(term.status, Boolean(term.gloss_md));
    } catch {
      setStatus('Error loading glossary item.');
    }
  }

  async function postGlossaryDecision(action) {
    if (!currentGlossaryId) return;
    const payload = { term_id: currentGlossaryId, action, note: document.getElementById('glossary-note').value };
    if (action === 'edit') payload.gloss_md = document.getElementById('glossary-edit').value;
    try {
      const res = await fetch('/api/glossary/decision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) { setStatus('Error: ' + (body.error || res.status)); return; }
      setStatus('Saved: ' + body.status);
      await loadGlossaryQueue();
    } catch {
      setStatus('Network error.');
    }
  }

  document.getElementById('glossary-queue').addEventListener('change', (e) => {
    currentGlossaryId = e.target.value;
    if (currentGlossaryId) loadGlossaryItem(currentGlossaryId);
  });
  document.getElementById('g-btn-save-edit').addEventListener('click', () => postGlossaryDecision('edit'));
  document.getElementById('g-btn-approve').addEventListener('click', () => postGlossaryDecision('approve'));
  document.getElementById('g-btn-reject').addEventListener('click', () => postGlossaryDecision('reject'));
  document.getElementById('g-btn-publish').addEventListener('click', () => postGlossaryDecision('publish'));

  // ---- tab switching ----
  function showTab(tab) {
    document.getElementById('tab-summaries').classList.toggle('active', tab === 'summaries');
    document.getElementById('tab-glossary').classList.toggle('active', tab === 'glossary');
    document.getElementById('summary-panes').style.display = tab === 'summaries' ? '' : 'none';
    document.getElementById('glossary-panes').style.display = tab === 'glossary' ? '' : 'none';
    document.getElementById('queue').style.display = tab === 'summaries' ? '' : 'none';
    document.getElementById('glossary-queue').style.display = tab === 'glossary' ? '' : 'none';
    document.getElementById('glossary-toolbar').style.display = tab === 'glossary' ? '' : 'none';
    if (tab !== 'glossary') {
      const sampleResults = document.getElementById('glossary-sample-results');
      sampleResults.style.display = 'none';
      sampleResults.textContent = '';
    }
  }
  document.getElementById('tab-summaries').addEventListener('click', () => showTab('summaries'));
  document.getElementById('tab-glossary').addEventListener('click', () => showTab('glossary'));

  loadQueue();
  loadGlossaryQueue();
</script>
</body>
</html>
