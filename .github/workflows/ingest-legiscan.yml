# Daily LegiScan ingestion — kept apart from the hourly tick on purpose.
#
# WHY ITS OWN WORKFLOW. LegiScan runs average 9.5 minutes and have reached 53 (measured over 30 days
# of real runs). If it shared `concurrency: ingest` with the hourly job, one long LegiScan run would
# block the next several hourly ticks — turning a slow bulk fetch into a freshness outage for the
# three fast Missouri/federal sources that had nothing to do with it.
#
# It also has its own budget shape: ~30 runs/month at ~9.5 min is ~285 Actions minutes, and that is
# a number worth being able to see and change independently of the hourly cron.
#
# CADENCE. scheduled-ingest.js already gates LegiScan behind its own 24h interval, so running this
# daily is belt-and-braces rather than a second source of truth: if the workflow fires early, the
# script simply reports the source is not due and exits cheaply. That means a late or duplicated
# cron cannot cause a double-fetch or burn LegiScan API quota (LEGISCAN_MONTHLY_QUERY_CAP).

name: ingest-legiscan

on:
  schedule:
    - cron: '23 9 * * *'   # 09:23 UTC daily — off the hour, and away from the :07 hourly tick so the
                           # two are not competing for a runner at the same instant.
  workflow_dispatch:

concurrency:
  group: ingest-legiscan   # separate group from `ingest` — that separation is the whole point
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  legiscan:
    runs-on: ubuntu-latest
    timeout-minutes: 90    # observed max is 53 min; 90 leaves headroom without letting a wedged run
                           # sit burning metered minutes for the 6h GitHub default

    steps:
      # PRE-CUTOVER GUARD. Added 2026-08-30 after this workflow failed every hour from 20:54.
      #
      # The schedule fires as soon as the file is on main, but the secrets are added by hand later
      # (docs/GITHUB_ACTIONS_MIGRATION.md step 1). Between those two moments every tick ran, failed
      # on all four sources in ~18s, wrote nothing, and burned metered minutes plus a notification.
      # The migration doc claimed "nothing runs until you add the secrets" -- that was simply wrong,
      # and hourly red ticks before cutover are exactly the alert fatigue the health check was
      # designed to avoid.
      #
      # MASKING RISK, and why it is acceptable: once configured, a secret later REMOVED would skip
      # silently rather than fail. That is covered -- check-ingest-health.mjs reports SILENT after a
      # source goes 25h without an attempt, so a workflow quietly skipping shows up as a dead feed
      # within a day. The guard hides a startup state, not a failure.
      - name: Skip until cutover
        id: guard
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets not configured yet - workflow is inert until cutover (docs/GITHUB_ACTIONS_MIGRATION.md step 1). This is not a failure."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.configured == 'true'

      - name: Ingest LegiScan
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          LEGISCAN_MONTHLY_QUERY_CAP: ${{ vars.LEGISCAN_MONTHLY_QUERY_CAP }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: node scripts/scheduled-ingest.js --only legiscan

      # Same reason as ingest.yml: the step above exits 0 on operational failure by design, so its
      # status proves only that node did not crash. This step reads ingestion_runs, the scheduler's
      # own durable signal. Omitting it here while having it on the hourly workflow left the exact
      # defect it exists to catch alive in the daily path for a day (caught in review, 2026-08-29).
      - name: Verify ingestion actually worked
        if: always() && steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-ingest-health.mjs --only legiscan
