# Hourly ingestion — the fast sources.
#
# WHY THIS EXISTS (2026-08-29). Ingestion used to run on Windows Task Scheduler on Lance's desktop,
# every 15 minutes, in a process holding SUPABASE_SERVICE_ROLE_KEY — a key that bypasses every RLS
# wall. That process also parses PDFs fetched from EXTERNAL government sites, and pdfjs-dist 6.1.200
# carried GHSA-hq66-cqwq-w95j ("arbitrary JavaScript execution upon opening a malicious PDF").
# Patching the CVE removed the instance; it did not change the blast radius. A successful RCE would
# have executed on a personal machine, beside a browser profile and several other projects'
# credentials — a credential harvest, not a scoped compromise.
#
# Here, the same code runs in a throwaway container that is destroyed when the job ends, and the key
# lives in GitHub Secrets rather than in a .env at rest on a desktop.
#
# CADENCE: hourly, not */15. This repo is PRIVATE, so Actions minutes are metered (2,000/month on
# the Free plan). Measured over 30 days, real ingestion work is ~1,321 minutes; add ~0.5-0.75 min of
# runner start + install per job and */15 (2,880 jobs) would blow the free tier and cost $30-55/mo,
# which defeats the project's $0/month stack. Hourly (720 jobs) lands around 1,600-1,900 min/month —
# inside the tier, but the margin IS thin. If it ever runs over, the lever is this cron line, not
# the code. Roll calls do not change every 15 minutes; hourly is well inside what the data warrants.
#
# CRON DRIFT IS SAFE HERE, which is why hourly works at all. GitHub's scheduler is best-effort and
# routinely fires late under load. scheduled-ingest.js does not care: it decides per-source due-ness
# by reading ingestion_runs, so a late tick simply finds more work due and does it. There is no
# fixed-interval assumption to violate.
#
# LEGISCAN IS DELIBERATELY NOT HERE — see ingest-legiscan.yml. Its runs average 9.5 min and have hit
# 53. Sharing a concurrency group with the hourly job would let one LegiScan run block the next
# several hourly ticks.

name: ingest

on:
  schedule:
    - cron: '7 * * * *'   # :07 past the hour — off the top-of-hour stampede, which is when GitHub's
                          # scheduler is most heavily delayed.
  workflow_dispatch:      # so Lance can force a tick without waiting for cron

# Never let two ingest ticks overlap: they would race on the same ingestion_runs rows and double-
# fetch the same sources. cancel-in-progress:false because a half-finished ingest is worse than a
# late one — let the running tick finish and skip this one.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read          # the job only reads code; it writes to Supabase, never back to the repo

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the four fast sources; anything longer means something is wedged

    steps:
      # PRE-CUTOVER GUARD. Added 2026-08-30 after this workflow failed every hour from 20:54.
      #
      # The schedule fires as soon as the file is on main, but the secrets are added by hand later
      # (docs/GITHUB_ACTIONS_MIGRATION.md step 1). Between those two moments every tick ran, failed
      # on all four sources in ~18s, wrote nothing, and burned metered minutes plus a notification.
      # The migration doc claimed "nothing runs until you add the secrets" -- that was simply wrong,
      # and hourly red ticks before cutover are exactly the alert fatigue the health check was
      # designed to avoid.
      #
      # MASKING RISK, and why it is acceptable: once configured, a secret later REMOVED would skip
      # silently rather than fail. That is covered -- check-ingest-health.mjs reports SILENT after a
      # source goes 25h without an attempt, so a workflow quietly skipping shows up as a dead feed
      # within a day. The guard hides a startup state, not a failure.
      - name: Skip until cutover
        id: guard
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets not configured yet - workflow is inert until cutover (docs/GITHUB_ACTIONS_MIGRATION.md step 1). This is not a failure."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: '24'     # matches the version the suite is green on locally
          cache: npm             # keeps `npm ci` around 15s instead of ~60s — directly protects the
                                 # minute budget above, since install overhead is paid every job

      - run: npm ci
        if: steps.guard.outputs.configured == 'true'

      # Each source runs independently: one source being down (a government site 500ing) must not
      # stop the other three.
      #
      # ⚠ THE EXIT CODE BELOW ONLY CATCHES CRASHES, NOT FAILED INGESTION — do not read a green tick
      # here as "ingestion worked". scheduled-ingest.js exits 0 on operational failure BY DESIGN
      # (see its comment at ~line 1253: "a transient/expected operational outcome exits 0 and relies
      # on an honest log record, never process.exitCode"). That convention is correct and unchanged.
      # It does mean this step's status is close to a constant, and a status that never varies
      # carries zero bits — the exact shape that once let us-congress close 121 of 121 runs `partial`
      # while perfectly healthy. The real verdict comes from the health-check step after this one,
      # which reads ingestion_runs. Keep both: this catches a crashed process, that catches a broken
      # feed, and neither can see the other's failure.
      - name: Ingest fast sources
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          set -u
          failed=""
          for src in mo-senate-web mo-house-xml us-congress us-senate; do
            echo "::group::$src"
            if node scripts/scheduled-ingest.js --only "$src"; then
              echo "$src ok"
            else
              echo "$src FAILED"
              failed="$failed $src"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::ingest process CRASHED for:$failed"
            exit 1
          fi

      # The verdict that actually means something. Reads ingestion_runs rather than an exit code,
      # and is deliberately tolerant: a single failed run is weather (government sites 500), so a
      # source must fail 3 times consecutively before this reddens. Failing hourly on transient
      # noise would train everyone to ignore the one channel that will ever report something real.
      #
      # It also fires on SILENCE — a source that stopped being attempted at all has zero failures
      # and looks perfect to any failure-counting check. `if: always()` so a crash in the step above
      # does not skip the diagnosis that explains it.
      # --only the four hourly sources. Checking legiscan here would alarm HOURLY about a DAILY
      # feed: legiscan is due-gated at 24h and measured from the previous run's start, so a normal
      # day-to-day drift can legitimately push its next run past a fixed daily cron, skipping a day.
      # Its newest row then ages past any threshold tuned for hourly sources and this job would
      # report SILENT every hour on a perfectly healthy feed. A workflow should only assert on the
      # sources it is responsible for.
      - name: Verify ingestion actually worked
        if: always() && steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-ingest-health.mjs --only mo-senate-web,mo-house-xml,us-congress,us-senate
